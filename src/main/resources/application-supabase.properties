spring.application.name=omrestaurant
server.port=${PORT:8080}

# Supabase PostgreSQL Session Pooler Datasource
spring.datasource.url=${DATABASE_URL:${SUPABASE_DB_URL:${SUPABASE_URL:jdbc:postgresql://${SUPABASE_DB_HOST:${DB_HOST:aws-0-ap-south-1.pooler.supabase.com}}:${SUPABASE_DB_PORT:${DB_PORT:5432}}/${SUPABASE_DB_NAME:${DB_NAME:postgres}}?sslmode=require}}}
spring.datasource.username=${DB_USER:${SUPABASE_DB_USERNAME:${DB_USERNAME:postgres.dpckliukvkdwerjqbxhu}}}
spring.datasource.password=${DB_PASSWORD:${SUPABASE_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# SAFETY: Do not automatically execute schema.sql against Supabase
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

# HikariCP Tuning for Supabase Session Pooler
# Keep pool lean to respect Supabase pooler limits
spring.datasource.hikari.pool-name=OmRestaurantSupabasePool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.leak-detection-threshold=60000

# Security & Error Handling: Never expose internal database details
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
