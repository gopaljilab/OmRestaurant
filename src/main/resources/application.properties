spring.application.name=omrestaurant
server.port=${PORT:8080}

# Database Datasource (Supports DATABASE_URL from Render/Railway/Fly.io, or DB_URL / DB_HOST)
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:om_test}}}
spring.datasource.username=${DB_USER:${DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:testpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true
server.error.include-message=never
